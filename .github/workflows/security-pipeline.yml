name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pipeline-tests:
    name: Pipeline regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test failure handling and report contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check this workflow with the pinned actionlint image
        run: python3 scripts/lint_workflows.py

  scan:
    name: Scan (${{ matrix.scanner }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false # One failed scanner must not cancel the other reports.
      matrix:
        scanner: [gitleaks, semgrep, trivy, zap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify real Semgrep exit-code and report behavior
        if: matrix.scanner == 'semgrep'
        run: python3 scripts/verify_semgrep_contract.py
      - name: Run scanner and require a complete report
        run: python3 scripts/scan.py "${{ matrix.scanner }}"
      - name: Preserve reports and provenance, also on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.scanner }}-report
          path: reports/${{ matrix.scanner }}/
          if-no-files-found: error
          retention-days: 30

  security-checks:
    # Configure a repository ruleset separately; this job alone does not protect main.
    name: Security checks
    if: always()
    needs: [pipeline-tests, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all tests and scanners to have succeeded
        env:
          TEST_RESULT: ${{ needs.pipeline-tests.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$SCAN_RESULT" = success
