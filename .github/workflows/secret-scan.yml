name: Secret Detection

# Läuft bei jedem Push und PR auf main, zusätzlich montags um 06:00 UTC.
# Der geplante Lauf ist Absicht: ein Secret, das heute nicht im Code ist,
# kann nächste Woche drin sein, und ein Scanner der nur bei Änderungen
# anspringt findet nichts in einem Repo das gerade niemand anfasst.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Volle Historie. Ohne das sieht Gitleaks nur den letzten Commit,
          # und ein Secret das vor zehn Commits entfernt wurde steht trotzdem
          # noch in der Historie und ist weiterhin abrufbar.
          fetch-depth: 0

      - name: Gitleaks über die Git-Historie laufen lassen
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
            --report-format json \
            --report-path /repo/reports/gitleaks-report.json \
            --redact \
            --verbose \
            --exit-code 1

      - name: Report als Artefakt sichern
        # "always", weil der Report gerade dann interessant ist wenn der
        # Job vorher rot geworden ist.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30
